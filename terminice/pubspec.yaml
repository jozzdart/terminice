name: terminice
description: "A robust terminal UI toolkit for Dart CLI apps. 30+ ready-to-use components, 11 built-in style presets, display modes, fallback policies, testing utilities, and zero boilerplate."
version: 1.3.0
homepage: https://github.com/jozzdart/terminice
repository: https://github.com/jozzdart/terminice/tree/main/terminice
issue_tracker: https://github.com/jozzdart/terminice/issues
documentation: https://github.com/jozzdart/terminice/tree/main/terminice#readme
topics:
  - terminal
  - cli
  - prompt
  - terminal-interface
  - terminal-ui

environment:
  sdk: ">=3.3.0 <4.0.0"

platforms:
  linux:
  macos:
  windows:

dependencies:
  terminice_core: ^1.2.0
  intl: ^0.20.0
  time_plus: ^1.3.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
